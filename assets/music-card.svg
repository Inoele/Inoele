<!-- save as assets/music-card.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Now playing">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0F3"/>
      <stop offset="1" stop-color="#FFE6ED"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD6E0"/>
      <stop offset="1" stop-color="#FFC5D3"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#FFC5D3" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 22px 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill:#6b2230; }
      .artist { font: 400 16px 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill:#8a3a50; opacity:0.9; }
      .badge { font: 600 12px 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill:white; letter-spacing:0.6px; }
      .play { cursor:pointer; }
      .pulse { transform-origin: center; }
    </style>
  </defs>

  <!-- background card -->
  <rect x="12" y="12" rx="20" ry="20" width="876" height="196" fill="url(#g1)" stroke="rgba(255,197,211,0.15)" stroke-width="1" filter="url(#softShadow)"/>

  <!-- left album / play area -->
  <g transform="translate(28,28)">
    <rect width="164" height="164" rx="16" ry="16" fill="url(#g2)"/>
    <circle cx="82" cy="82" r="36" fill="white" opacity="0.06"/>
    <g class="play" transform="translate(82,82)">
      <circle class="pulse" cx="0" cy="0" r="34" fill="#fff" opacity="0.06"/>
      <circle cx="0" cy="0" r="28" fill="#FFC5D3"/>
      <polygon points="6,-10 18,0 6,10" fill="white" transform="translate(-2,0)"/>
      <animateTransform xlink:href=".pulse" attributeName="transform" type="scale" values="1;1.06;1" dur="1.8s" repeatCount="indefinite"/>
      <animate xlink:href=".pulse" attributeName="opacity" values="0.06;0.12;0.06" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- right text area -->
  <g transform="translate(216,42)">
    <text x="0" y="28" class="title">Semua Aku Dirayakan</text>
    <text x="0" y="58" class="artist">by Nadin Amizah</text>
    <g transform="translate(0,80)">
      <rect x="0" y="0" width="148" height="30" rx="8" ry="8" fill="#FFC5D3" />
      <text x="16" y="20" class="badge">dreamy • calm • pastel</text>
    </g>
    <g transform="translate(0,130)" opacity="0.12">
      <rect x="0" y="6" width="10" height="18" rx="3" fill="#6b2230"/>
      <rect x="18" y="2" width="10" height="26" rx="3" fill="#6b2230"/>
      <rect x="36" y="8" width="10" height="20" rx="3" fill="#6b2230"/>
      <rect x="54" y="0" width="10" height="36" rx="3" fill="#6b2230"/>
      <rect x="72" y="10" width="10" height="16" rx="3" fill="#6b2230"/>
      <rect x="90" y="4" width="10" height="28" rx="3" fill="#6b2230"/>
      <rect x="108" y="6" width="10" height="18" rx="3" fill="#6b2230"/>
    </g>
  </g>

  <text x="720" y="200" font="12px sans-serif" fill="#9b465f" opacity="0.6">click to play on YouTube ▶</text>
</svg>
